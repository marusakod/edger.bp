{% set version = "0.1.1" %}

package:
  name: r-edger-bp
  version: {{ version }}

source:
  url: https://github.com/wmacnair/edger.bp/archive/refs/tags/v{{ version }}.tar.gz
  sha256: a03f6440457b0a8eea33e074e10ff984374a529fb4d25a48657ab70547488e4c

build:
  number: 0
  string: r44_0
  script: $R CMD INSTALL --build . ${R_ARGS}
  ignore_run_exports:
    - r-base

requirements:
  host:
    - r-base ==4.4.3
    - r-bpcells ==0.3.1
    - bioconductor-edger ==4.4.0
    - bioconductor-limma ==3.62.0
  run:
    - r-base ==4.4.3
    - r-bpcells ==0.3.1
    - bioconductor-edger ==4.4.0
    - bioconductor-limma ==3.62.0

test:
  imports:
    - edger.bp
  commands:
    - $R -e 'audit <- edger.bp::bp_check_versions(error = TRUE); stopifnot(all(audit$ok))'

about:
  home: https://github.com/wmacnair/edger.bp
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  summary: Memory-efficient edgeR workflows for BPCells matrices

extra:
  recipe-maintainers:
    - wmacnair
